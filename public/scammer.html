<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>المحتال — محاكاة الدرع الذكي</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="iphone.css">
  <link rel="stylesheet" href="scammer.css">
</head>
<body class="scam">
  <div class="ip-screen sc-screen" id="scScreen">
    <div class="ip-status sc-status">
      <span class="ip-time" id="scTime"></span>
      <div class="ip-island"></div>
      <span class="ip-icons">
        <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 11.5l2.4-2.6a3.4 3.4 0 0 0-4.8 0zM3.5 6.8a6.4 6.4 0 0 1 9 0l1.6-1.7a8.7 8.7 0 0 0-12.2 0zM.4 3.5a11 11 0 0 1 15.2 0L16 3.1 14.7 1.7a12.9 12.9 0 0 0-13.4 0L0 3.1z"/></svg>
        <svg viewBox="0 0 27 13" width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="12" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" opacity=".4"/></svg>
      </span>
    </div>

    <div class="sc-main" id="scMain">
      <div class="sc-head">
        <div class="sc-title" id="tTitle"></div>
        <button id="langBtn" class="sc-lang" type="button"></button>
      </div>
      <div class="sc-warn" id="tWarn"></div>

      <div class="sc-link" id="linkCard">
        <span class="sc-dot" id="linkDot"></span>
        <div class="sc-link-txt"><b id="linkState"></b><small id="linkSub"></small></div>
        <input id="codeInput" class="sc-code" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="code">
      </div>

      <div class="sc-seg" role="tablist">
        <button type="button" role="tab" data-tab="sms" aria-selected="true" id="tabSms"></button>
        <button type="button" role="tab" data-tab="calls" aria-selected="false" id="tabCalls"></button>
      </div>

      <div id="paneSms" class="sc-pane"></div>
      <div id="paneCalls" class="sc-pane" hidden></div>
    </div>

    <!-- المكالمة -->
    <div class="sc-call" id="scCall" hidden>
      <div class="sc-call-top">
        <div class="sc-av">👤</div>
        <div class="sc-callee" id="callee"></div>
        <div class="sc-callstate" id="callState"></div>
        <div class="sc-pill" id="callPill"></div>
      </div>
      <div class="sc-script">
        <div class="sc-script-h" id="sayTitle"></div>
        <div id="phrases" class="sc-phrases"></div>
      </div>
      <div class="sc-free" id="freeBox" hidden>
        <button type="button" class="sc-mic" id="btnMic" aria-label="mic">🎙️</button>
        <div class="sc-free-r">
          <div class="sc-interim" id="interim"></div>
          <div class="sc-free-in"><input id="freeText" dir="auto" autocomplete="off"><button type="button" id="btnFreeSend">➤</button></div>
        </div>
      </div>
      <div class="sc-call-tools">
        <label class="sc-toggle"><input type="checkbox" id="micToggle"> <span id="micLbl"></span></label>
        <label class="sc-toggle"><input type="checkbox" id="outToggle"> <span id="outLbl"></span></label>
      </div>
      <button class="sc-hang" id="btnHang" type="button" aria-label="End">
        <svg viewBox="0 0 60 60" width="34" height="34"><path fill="#fff" d="M30 22c-8.6 0-16.4 2.4-21.3 6.4-1.4 1.1-1.7 3-.8 4.5l2.3 3.6c.8 1.3 2.5 1.8 3.9 1.2l5.6-2.3c1.2-.5 2-1.7 1.9-3l-.2-3.3c5.6-1.9 11.6-1.9 17.2 0l-.2 3.3c-.1 1.3.7 2.5 1.9 3l5.6 2.3c1.4.6 3.1.1 3.9-1.2l2.3-3.6c.9-1.5.6-3.4-.8-4.5C46.4 24.4 38.6 22 30 22z"/></svg>
      </button>
    </div>
    <button class="ip-homebar sc-homebar" type="button" aria-hidden="true" tabindex="-1"></button>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>
  <script src="tones.js"></script>
<script src="voice.js"></script>
  <script src="live.js"></script>
  <script src="scammer.js"></script>
</body>
</html>
