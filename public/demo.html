<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدرع الذكي — عرض حيّ بهاتفين</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="iphone.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="demo">
  <header class="d-top">
    <img class="d-logo college" src="logo-college.png" alt="كلية الشرطة">
    <div class="d-brand"><img src="icon.svg" alt="" width="44" height="44"><div><h1 id="dTitle"></h1><p id="dSub"></p></div></div>
    <div class="d-left"><div class="d-actions"><button id="dJudge" class="d-lang d-judge" type="button"></button><button id="dVoices" class="d-lang" type="button" hidden style="display:none"></button><button id="dAiTech" class="d-lang" type="button"></button><button id="dSettings" class="d-lang" type="button"></button><button id="dPortal" class="d-lang d-portal" type="button"></button><button id="dLang" class="d-lang" type="button"></button></div><img class="d-logo l42" src="logo-42.png" alt="42 أبوظبي"></div>
  </header>

  <div class="d-warn" id="voiceWarn" hidden><span id="vwTxt"></span> <a id="vwEdge" hidden></a></div>
  <div class="d-stage" id="dStage">
    <!-- هاتف المحتال -->
    <figure class="d-phone">
      <div class="ip-device d-device">
        <div class="ip-btn ip-btn-l1"></div><div class="ip-btn ip-btn-l2"></div><div class="ip-btn ip-btn-l3"></div><div class="ip-btn ip-btn-r"></div>
        <div class="d-screen"><iframe id="fScam" title="scammer phone" allow="microphone; autoplay"></iframe></div>
      </div>
      <figcaption class="d-cap scam"><span class="d-cap-dot"></span><span id="capScam"></span></figcaption>
    </figure>

    <!-- الاتصال بين الهاتفين -->
    <div class="d-bridge" id="bridge" data-state="off">
      <div class="d-pill" id="pill"><span class="d-pill-dot"></span><span id="pillTxt"></span></div>
      <div class="d-wire">
        <svg viewBox="0 0 240 40" preserveAspectRatio="none" class="d-svg" aria-hidden="true">
          <defs>
            <linearGradient id="gOn" x1="0" x2="1"><stop offset="0" stop-color="#ff6b5f"/><stop offset=".55" stop-color="#8ee3c8"/><stop offset="1" stop-color="#4ad991"/></linearGradient>
          </defs>
          <path class="w-base" d="M0 20 H240"/>
          <path class="w-flow" d="M0 20 H240"/>
        </svg>
        <span class="d-end e-scam"></span>
        <span class="d-end e-vic"></span>
        <div class="d-shield" id="shieldNode"><img src="icon.svg" alt=""></div>
        <div class="d-wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div id="packets"></div>
      </div>
      <div class="d-event" id="evt"></div>
      <div class="d-ai" id="ai" hidden>
        <div class="d-ai-h"><span>🧠</span><b id="aiTitle"></b></div>
        <ol id="aiSteps"></ol>
      </div>
      <ol class="d-log" id="log"></ol>
    </div>

    <!-- هاتف الضحية -->
    <figure class="d-phone">
      <div class="ip-device d-device">
        <div class="ip-btn ip-btn-l1"></div><div class="ip-btn ip-btn-l2"></div><div class="ip-btn ip-btn-l3"></div><div class="ip-btn ip-btn-r"></div>
        <div class="d-screen"><iframe id="fVictim" title="victim phone" allow="microphone; autoplay"></iframe></div>
      </div>
      <figcaption class="d-cap vic"><span class="d-cap-dot"></span><span id="capVic"></span></figcaption>
    </figure>
  </div>
  <aside class="d-drawer" id="drawerAi" hidden>
    <button class="d-close" id="aiClose" type="button" aria-label="close">✕</button>
    <iframe id="fAiTech" title="ai"></iframe>
  </aside>
  <aside class="d-drawer" id="drawerSet" hidden>
    <button class="d-close" id="setClose" type="button" aria-label="close">✕</button>
    <iframe id="fSettings" title="settings" allow="microphone"></iframe>
  </aside>
  <aside class="d-drawer" id="drawer" hidden>
    <button class="d-close" id="drawerClose" type="button" aria-label="close">✕</button>
    <iframe id="fPartner" title="institutions portal"></iframe>
  </aside>
  <div class="d-pop" id="voicePop" hidden>
    <b id="vTitle"></b>
    <label><span id="vScamL"></span><select id="vScam"></select><button type="button" id="vScamT">▶</button></label>
    <label><span id="vVicL"></span><select id="vVic"></select><button type="button" id="vVicT">▶</button></label>
    <small id="vNote"></small>
  </div>
  <div class="d-pop d-guide" id="judgePop" hidden>
    <button class="d-close" type="button" id="judgeClose">✕</button>
    <h3 id="gTitle"></h3>
    <ol id="gSteps"></ol>
    <small id="gNote"></small>
  </div>
  <script src="tones.js"></script>
  <script src="voice.js"></script>
  <script src="demo.js"></script>
</body>
</html>
